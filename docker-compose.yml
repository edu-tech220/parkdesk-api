services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - parkdesk-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ParkDesk;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      Jwt__Issuer: "ParkDesk"
      Jwt__Audience: "ParkDeskClients"
      Jwt__SigningKey: "CHANGE_ME_IN_PRODUCTION_SUPER_SECRET_KEY_1234567890"
    ports:
      - "8080:8080"

volumes:
  parkdesk-sqldata:
